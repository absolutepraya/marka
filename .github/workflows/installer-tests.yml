name: Installer Tests

on:
  pull_request:
    paths:
      - "scripts/install.sh"
      - "scripts/install.test.sh"
      - "scripts/install.integration.test.sh"
      - "scripts/install-smoke.mjs"
      - ".github/workflows/installer-tests.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/install.sh"
      - "scripts/install.test.sh"
      - "scripts/install.integration.test.sh"
      - "scripts/install-smoke.mjs"
      - ".github/workflows/installer-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Check Bash syntax
        run: bash -n scripts/install.sh

      - name: Run installer tests
        run: bash scripts/install.test.sh

  installer-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Install and exercise published stable images on clean Linux
        run: bash scripts/install.integration.test.sh
