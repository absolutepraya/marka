name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag and source commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          [[ "${{ github.event.created }}" == "true" && "${{ github.event.forced }}" != "true" ]] || {
            echo "Release tags must be created once and never moved." >&2
            exit 1
          }
          tag_type="$(git cat-file -t "refs/tags/$tag")"
          [[ "$tag_type" == "tag" ]] || {
            echo "Release tags must be annotated tags, received $tag_type" >&2
            exit 1
          }

          release_json="$(node scripts/release-contract.mjs validate-tag "$tag")"
          version="$(jq -r '.version' <<<"$release_json")"
          existing_release_count="$(gh release list --limit 1 --json tagName --jq 'length')"
          if [[ "$existing_release_count" == "0" && "$tag" != "v0.1.0" ]]; then
            echo "The first Marka release must be v0.1.0, received $tag" >&2
            exit 1
          fi
          target="$(git rev-parse "${tag}^{commit}")"
          [[ "$target" == "$GITHUB_SHA" ]] || {
            echo "Tag target $target does not match event commit $GITHUB_SHA" >&2
            exit 1
          }

          git fetch --no-tags origin main
          git merge-base --is-ancestor "$target" origin/main || {
            echo "Release target $target is not reachable from origin/main" >&2
            exit 1
          }

          short_sha="$(git rev-parse --short=12 "$target")"
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "target=$target"
            echo "short_sha=$short_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Verify exact-commit blocking CI
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ steps.release.outputs.target }}
        run: |
          set -euo pipefail
          ci_run_id="$(gh run list --workflow CI --commit "$TARGET" --limit 20 \
            --json databaseId,status,conclusion,headSha \
            --jq '.[] | select(.headSha == env.TARGET and .status == "completed" and .conclusion == "success") | .databaseId' \
            | head -n 1)"
          [[ -n "$ci_run_id" ]] || {
            echo "No successful CI workflow run exists for $TARGET" >&2
            exit 1
          }

          ci_jobs="$(gh run view "$ci_run_id" --json jobs --jq '.jobs[] | [.name, .conclusion] | @tsv')"
          for job in lint format typecheck tests open-api-spec; do
            grep -Fq "$job$(printf '\t')success" <<<"$ci_jobs" || {
              echo "Blocking CI job $job did not succeed in run $ci_run_id" >&2
              exit 1
            }
          done

      - name: Verify installer CI when installer paths changed
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ steps.release.outputs.target }}
        run: |
          set -euo pipefail
          changed_files="$(git diff-tree --no-commit-id --name-only -r "${TARGET}^1" "$TARGET")"
          if ! grep -Eq '^(scripts/install\.sh|scripts/install\.test\.sh|\.github/workflows/installer-tests\.yml)$' <<<"$changed_files"; then
            echo "No installer contract paths changed. Installer CI is not required."
            exit 0
          fi

          installer_run_id="$(gh run list --workflow "Installer Tests" --commit "$TARGET" --limit 20 \
            --json databaseId,status,conclusion,headSha \
            --jq '.[] | select(.headSha == env.TARGET and .status == "completed" and .conclusion == "success") | .databaseId' \
            | head -n 1)"
          [[ -n "$installer_run_id" ]] || {
            echo "Installer paths changed but no successful Installer Tests run exists for $TARGET" >&2
            exit 1
          }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check immutable release image pair
        id: images
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/marka
          VERSION: ${{ steps.release.outputs.version }}
          SHORT_SHA: ${{ steps.release.outputs.short_sha }}
        run: |
          set -euo pipefail
          get_digest() {
            docker buildx imagetools inspect "$1" --format '{{.Manifest.Digest}}' 2>/dev/null | head -n 1
          }

          version_count=0
          sha_count=0
          [[ -n "$(get_digest "$IMAGE_NAME:web-v$VERSION")" ]] && version_count=$((version_count + 1))
          [[ -n "$(get_digest "$IMAGE_NAME:workers-v$VERSION")" ]] && version_count=$((version_count + 1))
          [[ -n "$(get_digest "$IMAGE_NAME:web-sha-$SHORT_SHA")" ]] && sha_count=$((sha_count + 1))
          [[ -n "$(get_digest "$IMAGE_NAME:workers-sha-$SHORT_SHA")" ]] && sha_count=$((sha_count + 1))

          ((version_count == 0 || version_count == 2)) || {
            echo "Immutable release version pair is partial. Refusing to overwrite release tags." >&2
            exit 1
          }
          ((sha_count == 0 || sha_count == 2)) || {
            echo "Immutable release SHA pair is partial. Refusing to overwrite rollback tags." >&2
            exit 1
          }
          if ((version_count == 2 && sha_count == 2)); then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "ensure_sha=false" >> "$GITHUB_OUTPUT"
            echo "reuse_sha=true" >> "$GITHUB_OUTPUT"
          elif ((version_count == 2 && sha_count == 0)); then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "ensure_sha=true" >> "$GITHUB_OUTPUT"
            echo "reuse_sha=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "ensure_sha=false" >> "$GITHUB_OUTPUT"
            echo "reuse_sha=$([[ $sha_count -eq 2 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
            {
              echo 'web_tags<<EOF'
              echo "$IMAGE_NAME:web-v$VERSION"
              if ((sha_count == 0)); then echo "$IMAGE_NAME:web-sha-$SHORT_SHA"; fi
              echo 'EOF'
              echo 'workers_tags<<EOF'
              echo "$IMAGE_NAME:workers-v$VERSION"
              if ((sha_count == 0)); then echo "$IMAGE_NAME:workers-sha-$SHORT_SHA"; fi
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Verify existing SHA rollback pair
        if: steps.images.outputs.reuse_sha == 'true'
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/marka
          TARGET: ${{ steps.release.outputs.target }}
          SHORT_SHA: ${{ steps.release.outputs.short_sha }}
        run: |
          set -euo pipefail
          for ref in "$IMAGE_NAME:web-sha-$SHORT_SHA" "$IMAGE_NAME:workers-sha-$SHORT_SHA"; do
            docker pull "$ref" >/dev/null
            source="$(docker image inspect "$ref" --format '{{ index .Config.Labels "org.opencontainers.image.source" }}')"
            revision="$(docker image inspect "$ref" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
            [[ "$source" == "https://github.com/absolutepraya/marka" ]] || {
              echo "Unexpected source label on existing rollback image $ref: $source" >&2
              exit 1
            }
            [[ "$revision" == "$TARGET" ]] || {
              echo "Existing rollback image $ref points to $revision, expected $TARGET" >&2
              exit 1
            }
          done

      - name: Build and push web release images
        if: steps.images.outputs.build == 'true'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: docker/Dockerfile
          target: web
          platforms: linux/amd64
          build-args: |
            SERVER_VERSION=${{ steps.release.outputs.target }}
            SERVER_COMMIT=${{ steps.release.outputs.target }}
            SERVER_RELEASE=${{ steps.release.outputs.version }}
          push: true
          tags: ${{ steps.images.outputs.web_tags }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push workers release images
        if: steps.images.outputs.build == 'true'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: docker/Dockerfile
          target: workers
          platforms: linux/amd64
          build-args: |
            SERVER_VERSION=${{ steps.release.outputs.target }}
            SERVER_COMMIT=${{ steps.release.outputs.target }}
            SERVER_RELEASE=${{ steps.release.outputs.version }}
          push: true
          tags: ${{ steps.images.outputs.workers_tags }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify immutable image digests and source metadata
        id: verified
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/marka
          VERSION: ${{ steps.release.outputs.version }}
          TARGET: ${{ steps.release.outputs.target }}
        run: |
          set -euo pipefail
          get_digest() {
            docker buildx imagetools inspect "$1" --format '{{.Manifest.Digest}}' 2>/dev/null | head -n 1
          }
          web_ref="$IMAGE_NAME:web-v$VERSION"
          workers_ref="$IMAGE_NAME:workers-v$VERSION"
          web_digest="$(get_digest "$web_ref")"
          workers_digest="$(get_digest "$workers_ref")"
          [[ -n "$web_digest" && -n "$workers_digest" ]] || {
            echo "Immutable web/workers image digests are missing" >&2
            exit 1
          }

          docker pull "$web_ref" >/dev/null
          docker pull "$workers_ref" >/dev/null
          for ref in "$web_ref" "$workers_ref"; do
            source="$(docker image inspect "$ref" --format '{{ index .Config.Labels "org.opencontainers.image.source" }}')"
            revision="$(docker image inspect "$ref" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
            release="$(docker image inspect "$ref" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
            [[ "$source" == "https://github.com/absolutepraya/marka" ]] || {
              echo "Unexpected source label on $ref: $source" >&2
              exit 1
            }
            [[ "$revision" == "$TARGET" ]] || {
              echo "Unexpected source revision on $ref: $revision" >&2
              exit 1
            }
            [[ "$release" == "$VERSION" ]] || {
              echo "Unexpected release label on $ref: $release" >&2
              exit 1
            }
          done

          {
            echo "web_digest=$web_digest"
            echo "workers_digest=$workers_digest"
          } >> "$GITHUB_OUTPUT"

      - name: Complete missing SHA rollback pair
        if: steps.images.outputs.ensure_sha == 'true'
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/marka
          VERSION: ${{ steps.release.outputs.version }}
          SHORT_SHA: ${{ steps.release.outputs.short_sha }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "$IMAGE_NAME:web-sha-$SHORT_SHA" "$IMAGE_NAME:web-v$VERSION"
          docker buildx imagetools create --tag "$IMAGE_NAME:workers-sha-$SHORT_SHA" "$IMAGE_NAME:workers-v$VERSION"

      - name: Promote and verify paired stable channel
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/marka
          VERSION: ${{ steps.release.outputs.version }}
          WEB_DIGEST: ${{ steps.verified.outputs.web_digest }}
          WORKERS_DIGEST: ${{ steps.verified.outputs.workers_digest }}
        run: |
          bash scripts/promote-release.sh

      - name: Create or verify GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists."
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "Marka v$VERSION" \
            --generate-notes
