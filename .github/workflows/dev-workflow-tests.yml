name: Dev Workflow Tests

on:
  pull_request:
    paths:
      - "start-dev.sh"
      - "stop-dev.sh"
      - "scripts/setup-worktree.sh"
      - "scripts/dev-infra.sh"
      - "scripts/dev-infra.test.sh"
      - "scripts/copy-dev-state*.mjs"
      - "scripts/check-dev*.mjs"
      - "scripts/pull-prod-state.sh"
      - "scripts/pull-prod-state.test.sh"
      - "packages/plugins/lib/meiliIndexName.ts"
      - "packages/plugins/lib/meiliIndexName.test.ts"
      - "packages/plugins/search-meilisearch/**"
      - "packages/plugins/vectorstore-meilisearch/**"
      - "package.json"
      - ".github/workflows/dev-workflow-tests.yml"
  push:
    branches:
      - main
    paths:
      - "start-dev.sh"
      - "stop-dev.sh"
      - "scripts/setup-worktree.sh"
      - "scripts/dev-infra.sh"
      - "scripts/dev-infra.test.sh"
      - "scripts/copy-dev-state*.mjs"
      - "scripts/check-dev*.mjs"
      - "scripts/pull-prod-state.sh"
      - "scripts/pull-prod-state.test.sh"
      - "packages/plugins/lib/meiliIndexName.ts"
      - "packages/plugins/lib/meiliIndexName.test.ts"
      - "packages/plugins/search-meilisearch/**"
      - "packages/plugins/vectorstore-meilisearch/**"
      - "package.json"
      - ".github/workflows/dev-workflow-tests.yml"

permissions:
  contents: read

jobs:
  shared-dev-infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup
        uses: ./tooling/github/setup

      - name: Check Bash syntax
        run: |
          for script in start-dev.sh stop-dev.sh scripts/setup-worktree.sh scripts/dev-infra.sh scripts/dev-infra.test.sh scripts/pull-prod-state.sh scripts/pull-prod-state.test.sh; do
            bash -n "$script"
          done

      - name: Run shared dev infrastructure tests
        run: bash scripts/dev-infra.test.sh

      - name: Run dev diagnostics and SQLite snapshot tests
        run: node --test scripts/check-dev.test.mjs scripts/copy-dev-state.test.mjs

      - name: Run production-state pull tests
        run: bash scripts/pull-prod-state.test.sh

      - name: Run Meilisearch namespace tests
        run: pnpm --filter @karakeep/plugins test --run

      - name: Typecheck plugins
        run: pnpm --filter @karakeep/plugins typecheck
