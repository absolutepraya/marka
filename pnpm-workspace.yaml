packages:
  - "packages/*"
  - "apps/*"
  - "tooling/*"
  - "tools/*"
  - "docs"

nodeLinker: hoisted

allowBuilds:
  '@sentry/cli': true
  '@swc/core': true
  better-sqlite3: true
  esbuild: true
  re2: true
  sharp: true
  tesseract.js: true
  # These install scripts are informational or unnecessary for our installs.
  '@parcel/watcher': false
  core-js: false
  core-js-pure: false
  postman-code-generators: false
  protobufjs: false
  msgpackr-extract: false

patchedDependencies:
  react-tweet@3.2.2: "patches/react-tweet@3.2.2.patch"
  xcode@3.0.1: "patches/xcode@3.0.1.patch"
  playwright-extra@4.3.6: "patches/playwright-extra@4.3.6.patch"
  emoji-mart@5.6.0: patches/emoji-mart@5.6.0.patch

# Docker builds can prune packages that use one of the root patches.
allowUnusedPatches: true

minimumReleaseAgeExclude:
  - '@next/env@16.3.2'
  - '@next/swc-darwin-arm64@16.3.2'
  - '@next/swc-darwin-x64@16.3.2'
  - '@next/swc-linux-arm64-gnu@16.3.2'
  - '@next/swc-linux-arm64-musl@16.3.2'
  - '@next/swc-linux-x64-gnu@16.3.2'
  - '@next/swc-linux-x64-musl@16.3.2'
  - '@next/swc-win32-arm64-msvc@16.3.2'
  - '@next/swc-win32-x64-msvc@16.3.2'
  - next@16.3.2
  - '@next/bundle-analyzer@16.3.2'

overrides:
  # react-native-css-interop otherwise pulls a second react-native-reanimated
  # (4.2.x) whose worklets peer is incompatible with the app's Expo SDK pin.
  react-native-css-interop>react-native-reanimated: ~4.1.1
