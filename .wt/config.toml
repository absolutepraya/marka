worktree_path = ".worktrees"
port_offset_interval = 100
max_slots = 9
name_strategy = "cities"
branch_template = "{user}/{name}"
default_base = "origin/main"

# WT and T3 share the repository-owned development worktree lifecycle.
setup = [
  "bash \"$WT_ROOT_PATH/scripts/dev-worktree.sh\" setup",
]
teardown = [
  "bash \"$WT_ROOT_PATH/scripts/dev-worktree.sh\" stop",
]
