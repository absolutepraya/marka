worktree_path = ".worktrees"
port_offset_interval = 100
max_slots = 9
name_strategy = "cities"
branch_template = "{user}/{name}"
default_base = "origin/main"

# Setup prepares isolated dependencies, imports production state, and starts
# this worktree's detached development server.
setup = [
  "bash \"$WT_ROOT_PATH/scripts/run-pnpm.sh\" install --frozen-lockfile",
  "ln -sfn ../../.env apps/web/.env",
  "ln -sfn ../../.env apps/workers/.env",
  "ln -sfn ../../.env packages/db/.env",
  "WT_DATA_SOURCE=prod bash \"$WT_ROOT_PATH/scripts/setup-worktree.sh\"",
  "NO_COLOR=false bash \"$WT_ROOT_PATH/scripts/run-pnpm.sh\" dev:start -d",
]
teardown = [
  "NO_COLOR=false bash \"$WT_ROOT_PATH/scripts/run-pnpm.sh\" dev:stop",
]
