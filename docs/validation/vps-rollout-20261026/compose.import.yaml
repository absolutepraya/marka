# One-time import into a new, explicitly created volume. Never mount the old DB.
name: marka-search-import-v155-20261026

services:
  import:
    image: getmeili/meilisearch:v1.55.0@sha256:ff546679970126f8822e15d1b6a06bfbff1f2ce2e43f810cfb5258012f92de5c
    restart: "no"
    mem_limit: 512m
    cpus: 1
    env_file:
      - path: .import.env
        format: raw
    environment:
      MEILI_NO_ANALYTICS: "true"
    command: [meilisearch, --import-dump, /input.dump]
    volumes:
      - target:/meili_data
      - type: bind
        source: ${KARAKEEP_MEILI_DUMP_PATH:?set KARAKEEP_MEILI_DUMP_PATH to the verified fresh dump}
        target: /input.dump
        read_only: true
        bind:
          create_host_path: false

volumes:
  target:
    external: true
    name: ${KARAKEEP_MEILI_VOLUME:?set KARAKEEP_MEILI_VOLUME to the empty new target volume}
